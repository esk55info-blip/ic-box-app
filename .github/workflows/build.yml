name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Unsigned IPA
      run: |
        cd SwiftUIAppTemplate
        # تنظيف وبناء المشروع مباشرة اعتماداً على ملفاتك الجاهزة
        xcodebuild -project SwiftUIAppTemplate.xcodeproj -scheme SwiftUIAppTemplate -configuration Release clean archive -archivePath ../build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        
        # تحويل البناء إلى ملف IPA
        cd ..
        mkdir -p Payload
        cp -r build/App.xcarchive/Products/Applications/*.app Payload/
        zip -r my_app.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: CinemaApp-IPA
        path: my_app.ipa
